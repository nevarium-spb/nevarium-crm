# Невариум: сайт + CRM на одном VPS.
# caddy — только TLS и проброс на app: фронт отдаёт сам Node внутри контейнера
# приложения (ADR-008), отдельного тома с dist больше нет — раньше он монтировался
# с хоста, где dist/ (в .gitignore) никогда не собирался после единого контейнера.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    # DB_FILE=/data/crm.sqlite убран (перевод на Postgres, план в nevarium-lab#3) —
    # DATABASE_URL теперь приходит из .env (deploy/.env.example). ВАЖНО, ещё не
    # решено: этот Вариант Б (самостоятельный VPS + docker-compose) предполагал
    # SQLite прямо в томе контейнера — без него нужен ЛИБО отдельный сервис
    # postgres: в этом файле (свой том под данные), ЛИБО управляемый Postgres вовне
    # (как Timeweb в основном Варианте А). Ни один из них сюда пока не добавлен —
    # не решение, принятое молча, а открытый пункт: этот compose сейчас не поднимет
    # рабочую базу сам по себе, пока сюда не добавят postgres: или внешний DATABASE_URL.
    expose:
      - '3001'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  caddy-data:
  caddy-config:
