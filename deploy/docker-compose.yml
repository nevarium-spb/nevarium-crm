# Невариум: сайт + CRM на одном VPS.
# caddy — только TLS и проброс на app: фронт отдаёт сам Node внутри контейнера
# приложения (ADR-008), отдельного тома с dist больше нет — раньше он монтировался
# с хоста, где dist/ (в .gitignore) никогда не собирался после единого контейнера.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_FILE=/data/crm.sqlite
    volumes:
      - crm-data:/data
    expose:
      - '3001'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  crm-data:
  caddy-data:
  caddy-config:
