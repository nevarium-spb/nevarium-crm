# Невариум: сайт + CRM на одном VPS.
# caddy раздаёт статику (dist) и проксирует /api на app.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_FILE=/data/crm.sqlite
    volumes:
      - crm-data:/data
    expose:
      - '3001'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dist:/srv/dist:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  crm-data:
  caddy-data:
  caddy-config:
